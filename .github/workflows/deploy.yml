name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # la acción de deploy hace push a la rama gh-pages

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (svelte-check + eslint)
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build
        env:
          BASE_PATH: /cuentas
        run: bun run build

      - name: Generate .nojekyll
        run: touch build/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
